name: Smart Trigger Demo

on:
  push:
    branches:
      - main
      - release/*
    paths:
      - 'src/**'
      - 'app/**'

jobs:
  smart-trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Print Message when triggers run
        run: |
          echo "Workflow triggered because src/ or app/ changed."
