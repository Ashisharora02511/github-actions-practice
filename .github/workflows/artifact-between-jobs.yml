name: Artifacts between Jobs
on:
  workflow_dispatch:
jobs:
  generate-file:
    runs-on: ubuntu-latest
    steps:
      - name; Create File
        run: |
          echo "Hello from job1" > message.txt
      - name: UPload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: message-file
          path: message.txt
  read-file:
    needs: generate-file
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: message-file
     - name: Print File Contens
       run: |
         cat message.text

