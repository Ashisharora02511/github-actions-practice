name: GitHub Hosted Runners
on: 
  workflow_dispatch
jobs:
  ubuntu-job:
    runs-on: ubuntu-latest
    steps:
      - name: Print OS
        run: |
          echo "OS: Ubuntu"
          hostname
          whoami
  windows-job:
    runs-on: window-latest
    steps:
      - name: Print OS
        run: |
          echo "OS: Windows"
          hostname
          whoami
  mac-job:
    runs-on: macos-latest
    steps:
      - name: Print OS
        run: |
          echo "OS: macos"
          hostname
          whoami
