name: Reusable Docker Build and Push

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string

      tag:
        required: true
        type: string

    secrets:
      docker_username:
        required: true

      docker_token:
        required: true

    outputs:
      image_url:
        description: Docker image URL
        value: ${{ jobs.docker-build.outputs.image_url }}

jobs:
  docker-build:
    runs-on: ubuntu-latest

    outputs:
      image_url: ${{ steps.image.outputs.image_url }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Check Dockerfile
        run: |
          echo "Current directory:"
          pwd

          echo "Repository structure:"
          find . -maxdepth 4 -type f | sort | grep -E 'Dockerfile|pom.xml|mvnw' || true

          echo "Checking expected Dockerfile:"
          ls -la ./uberApp/uberApp/
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./uberApp
          file: ./uberApp/uberApp/DockerFile
          push: true
          tags: |
            ${{ inputs.image_name }}:${{ inputs.tag }}
            ${{ inputs.image_name }}:sha-${{ github.sha }}

      - name: Set Image URL
        id: image
        run: |
          echo "image_url=${{ inputs.image_name }}:${{ inputs.tag }}" >> "$GITHUB_OUTPUT"

