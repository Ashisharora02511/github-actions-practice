name: Scheduled Tasks

on:
  workflow_dispatch:

  schedule:
    - cron: '30 2 * * 1'
    - cron: '0 */6 * * *'

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Print Trigger Information
        run: |
          echo "Workflow Triggered"
          echo "Schedule: ${{ github.event.schedule }}"

      - name: Health Check
        run: |
          curl -I https://www.google.com
